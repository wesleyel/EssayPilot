<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--ORIGIN_TRIAL-->
<title>EssayPilot</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body class="no-essay">
<header class="topbar">
  <button id="btn-drawer" class="btn btn-icon" aria-label="作文列表" title="作文列表"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 12h16"/><path d="M4 6h16"/><path d="M4 18h16"/></svg></button>
  <nav class="crumbs" id="crumbs" aria-label="当前作文"><span class="brand">EssayPilot</span></nav>
  <span class="sp"></span>
  <a id="btn-highlights" class="btn btn-secondary btn-sm" href="#/highlights">重点句</a>
  <span id="top-score" class="top-score" title="最新评分"></span>
  <span class="vr"></span>
  <div class="seg view-seg" role="tablist" aria-label="视图">
    <button class="seg-btn" data-view="review" role="tab">批阅</button>
    <button class="seg-btn" data-view="versions" role="tab">版本</button>
  </div>
  <span class="vr hide-sm"></span>
  <span id="webmcp-status" class="status hide-sm" data-state="off"><span class="dot"></span><span class="txt">WebMCP 未检测到</span></span>
  <span id="mcp-status" class="status hide-sm"></span>
</header>

<div class="shell">
<div id="drawer-back" class="drawer-back" hidden></div>
<aside id="drawer" class="drawer" aria-label="作文列表" aria-hidden="true">
  <div class="drawer-in">
  <div class="drawer-top">
    <span class="drawer-title">作文</span><span class="sp"></span>
    <button id="btn-new" class="btn btn-primary btn-sm">新建</button>
    <button id="drawer-close" class="btn btn-icon" aria-label="关闭列表"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <input id="list-q" class="input" type="search" placeholder="搜索标题、题目、正文" aria-label="搜索作文">
  <div id="tag-filter" class="tag-filter"></div>
  <div id="tree" class="tree"></div>
  </div>
</aside>
<main id="main">
  <div id="empty" class="empty" hidden>
    <h2>EssayPilot</h2>
    <p>选择一篇作文，或新建一篇。评分、润色由本地 Agent 通过 MCP 完成，结果会实时出现在页面上。</p>
    <div class="row"><button class="btn btn-secondary" id="empty-open">打开列表</button><button class="btn btn-primary" id="empty-new">新建作文</button></div>
  </div>

  <section id="review" class="review" hidden>
    <div class="sheet">
      <div id="scorebar" class="scorebar"></div>
      <div class="toolrow">
        <span class="sp"></span>
        <button id="edit-toggle" class="btn btn-secondary btn-sm" hidden></button>
        <span class="muted xsmall">边注</span>
        <div class="seg mini" role="group" aria-label="边注显示">
          <button class="seg-btn" id="expand-all" aria-pressed="false" title="展开全部边注的完整内容">全部展开</button>
        </div>
        <button id="pen-toggle" class="btn btn-icon pen-toggle" aria-pressed="false" aria-label="荧光笔" title="荧光笔：在正文或题目上划选即标记，点已有标记擦掉（Esc 退出）"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg></button>
      </div>
      <div class="desk" id="desk">
        <div class="col-head l" id="head-l">重点</div>
        <div class="col-head c"><textarea id="title" class="title-input" rows="1" aria-label="标题" placeholder="未命名"></textarea><div class="wc" id="wc"></div><div id="info" class="pinfo" role="button" tabindex="0" aria-label="题目信息，点击编辑" title="点击编辑题目信息"></div></div>
        <div class="col-head r" id="head-r">问题</div>
        <div class="margin l" id="mL"></div>
        <div class="center">
          <div class="editor-wrap essay-text" id="editor"></div>
          <div id="reading" class="reading" hidden></div>
          <div id="orphans" class="orphans"></div>
        </div>
        <div class="margin r" id="mR"></div>
      </div>
    </div>
  </section>

  <section id="versions" class="versions" hidden></section>

  <section id="highlights" class="hl-page" hidden>
    <div class="hl-sheet">
      <div class="hl-head">
        <h1 class="hl-title">重点句</h1>
        <span id="hl-count" class="muted small"></span>
      </div>
      <div class="hl-tools">
        <input id="hl-q" class="input" type="search" placeholder="搜索句子、边注、作文标题" aria-label="搜索重点句">
        <label class="hl-group"><span class="muted xsmall">分组</span>
          <select id="hl-group" class="input sel" aria-label="分组方式">
            <option value="category">作文分类</option>
            <option value="type">题型</option>
            <option value="label">重点标签</option>
            <option value="tag">主题标签</option>
            <option value="essay">作文</option>
          </select>
        </label>
        <div class="seg mini" id="hl-subj" role="group" aria-label="科目">
          <button class="seg-btn" data-subj="">全部</button>
          <button class="seg-btn" data-subj="english">英语</button>
          <button class="seg-btn" data-subj="politics">政治</button>
        </div>
      </div>
      <div id="hl-list" class="hl-list"></div>
    </div>
  </section>
</main>
</div>

<footer class="dock" id="dock">
  <div class="dock-act">
    <div class="dock-h"><span>Agent 动态 · 实时</span><span class="sse-dot" title="SSE 连接"></span><span class="sp"></span>
      <button id="dock-toggle" class="btn btn-ghost btn-xs" aria-expanded="true" aria-controls="dock">收起 / 展开</button></div>
    <div id="activity" class="act-list" aria-live="polite"></div>
  </div>
  <div class="dock-see">
    <div class="dock-h"><span>Agent 此刻看到</span></div>
    <div id="sees" class="sees">未打开作文</div>
    <div class="prompt-btns">
      <button class="btn btn-secondary btn-sm" data-prompt="grade_essay">复制 grade_essay</button>
      <button class="btn btn-secondary btn-sm" data-prompt="review_my_marks">复制 review_my_marks</button>
      <button class="btn btn-secondary btn-sm" data-prompt="polish_essay">复制 polish_essay</button>
      <button class="btn btn-secondary btn-sm" data-prompt="mark_highlights">复制 mark_highlights</button>
    </div>
  </div>
</footer>


</body>
</html>
